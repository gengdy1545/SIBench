schema_version: 1
purpose: index_replay
target:
  secondary_indexes:
    enabled: true
  # A fresh RocksDB index in the driver process: complete publication without gRPC or network transport.
  service:
    adapter: rocksdb
    path: build/services/index/rocksdb-inprocess
    value: row_id
replay:
  strategy: single_pass
  dispatch_mode: operation
  client_count: 1
  max_in_flight: 4096
  request_timeout_seconds: 60
versions:
  gc:
    owner: none

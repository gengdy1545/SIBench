# Server parameters of the PostgreSQL that scripts/native-capture.sh starts for a capture.
# The script adds the port and socket directory; nothing here depends on the machine.

listen_addresses = '127.0.0.1'
timezone = 'UTC'
log_statement = 'none'

# The access ledger keys templates by PostgreSQL query identifier.
compute_query_id = on

# Parallel execution is not captured, and autovacuum would move rows outside the workload.
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
autovacuum = off

# Speed only: none of these changes a plan or the committed order of the workload. Sized for the
# 64 GB capture hosts (the single-instance server shares them with the benchmark clients).
shared_buffers = '16GB'
max_wal_size = '32GB'
min_wal_size = '4GB'
checkpoint_timeout = '30min'
checkpoint_completion_target = 0.9
wal_buffers = '64MB'
synchronous_commit = off
maintenance_work_mem = '2GB'

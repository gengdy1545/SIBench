schema_version: 1
purpose: native_capture_poc
benchmark: ycsb
source:
  path: benchmark/YCSB
  commit: 66302f301b13f60d4bcb2f29f478586bb1d6f2e0
native:
  table: usertable
  jdbc_table_creator: JdbcDBCreateTable
  recordcount: 8706000
  insertstart: 0
  insertcount: 8706000
  fieldcount: 10
  fieldlength: 100
  fieldlengthdistribution: constant
  insertorder: hashed
  zeropadding: 1
  # One captured thread; the uncaptured load may use more.
  threads: 1
  load_threads: 16
  timeout_minutes: 360
  build_directory: build/benchmarks/YCSB
  client_libraries: jdbc/target/ycsb-jdbc-binding-0.18.0-SNAPSHOT/lib
  # Upstream workload files run in this order on one growing table; each is a separate client JVM.
  # 8,706,000 rows matches the HyBench SF1 baseline; operation counts give about 60k committed
  # row changes in total, the order of the HyBench TP subset.
  workloads:
    workloada: {operationcount: 60000}
    workloadb: {operationcount: 100000}
    workloadc: {operationcount: 50000}
    workloadf: {operationcount: 40000}
    workloadd: {operationcount: 60000}
    # The pinned JDBC binding fills scan results only for explicit fields; with readallfields=true
    # CoreWorkload divides by the empty result and the client thread dies.
    workloade: {operationcount: 20000, properties: {readallfields: false}}
postgres:
  schema: public
  version: '14.24'
  port: 55433
  database: sibench_ycsb_8m_capture
  # The still database this capture clones; built once from the native load (see StillBase).
  clone_from: sibench_ycsb_8m_base
  user: postgres
  isolation: read_committed
  max_parallel_workers_per_gather: 0
capture:
  mode: instrumented_native_execution
  application_prefix: 'sibench:'
  raw_directory: results/poc/ycsb-8m/raw
  allow_event_loss: false
  statement_results: server_rows_and_consumed_rows
data_layout:
  target_file_size_bytes: 536870912
  file_size_max_overshoot_percent: 5
  row_group_max_rows: 1048576
  row_group_buffer_bytes: 67108864
  page_size_bytes: 1048576
  compression: zstd
  compression_level: 3
artifacts:
  directory: results/poc/ycsb-8m

schema_version: 1
purpose: index_replay
target:
  secondary_indexes:
    enabled: true
  # Any service speaking the SIBench index protocol, e.g. index-server config/index_service_rocksdb.yaml.
  service:
    adapter: grpc
    endpoint: 127.0.0.1:50551
    value: row_id
replay:
  strategy: single_pass
  dispatch_mode: operation
  client_count: 64
  max_in_flight: 4096
  request_timeout_seconds: 60
versions:
  gc:
    owner: none

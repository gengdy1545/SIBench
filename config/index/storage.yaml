# Object-storage profiles for object-storage index backends (first: rocksdb-cloud).
# Secrets are never written here: each *_env field names an environment variable.
# One run's effective profile (without secrets) is saved with that run's evidence.
# A local S3 pass does not stand in for COS; each profile is checked on its own.

profiles:
  # Local functional tests: an S3-compatible SeaweedFS gateway on the test host (build/services/).
  local_s3:
    kind: s3
    endpoint: http://127.0.0.1:8333
    region: us-east-1
    bucket: sibench-dev
    prefix: sibench/dev/          # every run appends its own run id below this prefix
    addressing: path
    access_key_env: LOCAL_S3_ACCESS_KEY
    secret_key_env: LOCAL_S3_SECRET_KEY

  # Tencent Cloud COS through its S3-compatible API.
  cos:
    kind: s3
    endpoint: https://cos-internal.ap-guangzhou.tencentcos.cn   # platform sub-account keys must use the internal domain
    region: ap-guangzhou
    bucket: replace-with-your-bucket-APPID          # set your own COS bucket, including its APPID
    prefix: sibench/                               # used only by SIBench; each run appends its run id
    addressing: virtual_hosted                     # COS requires virtual-hosted style
    versioning: disabled                           # bucket versioning must be off
    access_key_env: COS_SECRET_ID                  # CAM / STS SecretId
    secret_key_env: COS_SECRET_KEY                 # CAM / STS SecretKey
    session_token_env: COS_SESSION_TOKEN           # STS token; leave the variable unset for permanent keys

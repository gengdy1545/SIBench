schema_version: 1
purpose: index_service
# Use a fresh local path and object prefix for each run. Configure storage.yaml first.
service:
  backend: slatedb
  path: build/services/index/slatedb
  port: 50551
  value: row_id
  storage: config/index/storage.yaml
  profile: local_s3
  object_path: sibench/dev/slatedb/
  # Required: also record every write in the engine WAL. false acknowledges from memory; true is the WAL comparison.
  wal: false

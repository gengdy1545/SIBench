schema_version: 1
purpose: index_service
# SIBench service/bridge budgets; independent of engine worker counts.
execution:
  read_threads: 16
  write_threads: 8
  statistics: build/services/index/rocksdb_cloud.stats.jsonl
# Use a fresh local path and object prefix for each run. Configure object_storage in the runtime CONFIG first.
service:
  backend: rocksdb_cloud
  path: build/services/index/rocksdb_cloud
  port: 50551
  value: row_id
  storage: cos://replace-with-your-bucket-APPID/sibench/work/index/rocksdb_cloud/RUN-ID/
  # Required: also record every write in the engine WAL. false acknowledges from memory; true is the WAL comparison.
  wal: false

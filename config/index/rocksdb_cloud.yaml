schema_version: 1
purpose: index_service
# Use a fresh local path and object prefix for each run. Configure storage.yaml first.
service:
  backend: rocksdb_cloud
  path: build/services/index/rocksdb_cloud
  port: 50551
  value: row_id
  storage: config/index/storage.yaml
  profile: local_s3
  object_path: sibench/dev/rocksdb_cloud/

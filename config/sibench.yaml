# SIBench runtime settings and the explicit benchmark selection.
schema_version: 1
purpose: sibench
target:
  secondary_indexes:
    enabled: false
  service:
    # The deployed Index Service for this run; every backend speaks the same gRPC protocol.
    endpoint: 127.0.0.1:50551
    value: row_id
replay:
  dispatch_mode: operation
  client_count: 64
  max_in_flight: 4096
  # Baseline Puts per WriteBatch RPC; client_count × (batch − 1) must stay below max_in_flight. Workload operations are sent one per RPC.
  baseline_batch_operations: 64
  request_timeout_seconds: 600
# URI schemes select a connection: s3:// uses aws; cos:// uses cos.
# Bucket and object prefix belong to each URI. Credentials are resolved only on use.
object_storage:
  aws:
    endpoint: https://s3.us-east-1.amazonaws.com
    region: us-east-1
    addressing: virtual_hosted
    access_key_env: AWS_ACCESS_KEY_ID
    secret_key_env: AWS_SECRET_ACCESS_KEY
    session_token_env: AWS_SESSION_TOKEN
  cos:
    endpoint: https://cos-internal.ap-guangzhou.tencentcos.cn
    region: ap-guangzhou
    addressing: virtual_hosted
    access_key_env: COS_SECRET_ID
    secret_key_env: COS_SECRET_KEY
    session_token_env: COS_SESSION_TOKEN
benchmarks:
  hybench-tp:
    config: config/benchmark/hybench.yaml
    engine: postgres
    workload: tp
    trace:
      generate: true
      directory: results/traces/hybench-tp
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/hybench-tp/
  hybench-xp:
    config: config/benchmark/hybench.yaml
    engine: postgres
    workload: xp
    trace:
      generate: true
      directory: results/traces/hybench-xp
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/hybench-xp/
  sysbench-zipf080:
    config: config/benchmark/sysbench.yaml
    engine: postgres
    workload: oltp_read_write_zipf080
    trace:
      generate: true
      directory: results/traces/sysbench-zipf080
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/sysbench-zipf080/
  sysbench-zipf099:
    config: config/benchmark/sysbench.yaml
    engine: postgres
    workload: oltp_read_write_zipf099
    trace:
      generate: true
      directory: results/traces/sysbench-zipf099
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/sysbench-zipf099/
  ycsb-a:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloada
    trace:
      generate: true
      directory: results/traces/ycsb-a
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-a/
  ycsb-b:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloadb
    trace:
      generate: true
      directory: results/traces/ycsb-b
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-b/
  ycsb-c:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloadc
    trace:
      generate: true
      directory: results/traces/ycsb-c
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-c/
  ycsb-d:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloadd
    trace:
      generate: true
      directory: results/traces/ycsb-d
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-d/
  ycsb-e:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloade
    trace:
      generate: true
      directory: results/traces/ycsb-e
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-e/
  ycsb-f:
    config: config/benchmark/ycsb.yaml
    engine: rocksdb
    workload: workloadf
    trace:
      generate: true
      directory: results/traces/ycsb-f
      upload:
        enabled: false
        # path: cos://YOUR-BUCKET/sibench/traces/ycsb-f/
engines:
  duckdb: config/engine/duckdb.yaml
  postgres: config/engine/postgres.yaml
  rocksdb: config/engine/rocksdb.yaml
  pixels: config/engine/pixels/pixels.yaml
# pixels-experiment CONFIG [CDC_INPUT_DIRECTORY] PIXELS_BASELINE_DIRECTORY OUTPUT_DIRECTORY; independent of prepare-cdc.
# With updates: false, omit the CDC input directory.
pixels_experiment:
  trace: false
  updates: true
  max_transactions: 0 # Complete source transaction prefix; zero consumes all files once.
  timeout_seconds: 600
  queries:
    enabled: false
    timing: after # after the selected updates, or during their application
    directory: "" # Ready-to-run Trino .sql files, sorted by filename.
    rounds: 1
  freshness:
    enabled: false
    table: savingaccount
    column: fresh_ts
    sample_seconds: 5
  trino:
    # Set server for a dedicated external cluster with fixed Pixels service ports, or deployment_directory for a managed node.
    server: ""
    deployment_directory: ""
    user: sibench
    catalog: pixels
    schema: postgres
    timeout_seconds: 120
    heap: 40G
    query_memory: 24GB
    query_total_memory: 28GB
    heap_headroom: 12GB
    threads: 32
analysis:
  # Exact returned-row locality (analyze-accesses): requests per window and external-sort memory.
  accesses:
    window_requests: 10000
    sort_memory_bytes: 134217728
  layout:
    entries_per_block: 256
    blocks_per_file: 4096
    sort_memory_bytes: 1073741824
  window:
    business_changes: 10000
    l0_index_modifications: 10000
    heatmap_bins: 1000

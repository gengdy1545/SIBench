# SIBench runtime settings and the explicit benchmark selection.
schema_version: 1
purpose: sibench
target:
  secondary_indexes:
    enabled: false
  service:
    adapter: grpc
    endpoint: 127.0.0.1:50551
    value: row_id
replay:
  dispatch_mode: operation
  client_count: 64
  max_in_flight: 4096
  request_timeout_seconds: 600
benchmarks:
  - config: config/benchmark/ycsb.yaml
    mode: api
    engine: rocksdb
  - config: config/benchmark/sysbench.yaml
    mode: capture
    engine: postgres
  - config: config/benchmark/hybench.yaml
    mode: capture
    engine: duckdb
duckdb:
  build_directory: build/services/duckdb
  memory_limit: 16GiB
  threads: 8
postgres:
  build_directory: build/services/postgres
rocksdb:
  build_directory: build/services/rocksdb
  cache_bytes: 1073741824
  write_buffer_bytes: 4294967296
  background_jobs: 16
analysis:
  layout:
    entries_per_block: 256
    blocks_per_file: 4096
    sort_memory_bytes: 1073741824
  window:
    business_changes: 10000
    l0_index_modifications: 10000
    heatmap_bins: 1000

# SIBench runtime settings and the explicit benchmark selection.
schema_version: 1
purpose: sibench
target:
  secondary_indexes:
    enabled: false
  service:
    adapter: grpc
    endpoint: 127.0.0.1:50551
    value: row_id
replay:
  dispatch_mode: operation
  client_count: 64
  max_in_flight: 4096
  # Baseline Puts per WriteBatch RPC; client_count × (batch − 1) must stay below max_in_flight. Workload operations are sent one per RPC.
  baseline_batch_operations: 64
  request_timeout_seconds: 600
benchmarks:
  - config: config/benchmark/ycsb.yaml
    mode: api
    engine: rocksdb
  - config: config/benchmark/sysbench.yaml
    mode: capture
    engine: postgres
  - config: config/benchmark/hybench.yaml
    mode: capture
    engine: postgres
engines:
  duckdb: config/engine/duckdb.yaml
  postgres: config/engine/postgres.yaml
  rocksdb: config/engine/rocksdb.yaml
  pixels: config/engine/pixels/pixels.yaml
# pixels-experiment CONFIG [CDC_INPUT_DIRECTORY] PIXELS_BASELINE_DIRECTORY OUTPUT_DIRECTORY; independent of prepare-cdc.
# With updates: false, omit the CDC input directory.
pixels_experiment:
  trace: false
  updates: true
  max_transactions: 0 # Complete source transaction prefix; zero consumes all files once.
  timeout_seconds: 600
  queries:
    enabled: false
    timing: after # after the selected updates, or during their application
    directory: "" # Ready-to-run Trino .sql files, sorted by filename.
    rounds: 1
  freshness:
    enabled: false
    table: savingaccount
    column: fresh_ts
    sample_seconds: 5
  trino:
    # Set server for a dedicated external cluster with fixed Pixels service ports, or deployment_directory for a managed node.
    server: ""
    deployment_directory: ""
    user: sibench
    catalog: pixels
    schema: postgres
    timeout_seconds: 120
    heap: 40G
    query_memory: 24GB
    query_total_memory: 28GB
    heap_headroom: 12GB
    threads: 32
analysis:
  layout:
    entries_per_block: 256
    blocks_per_file: 4096
    sort_memory_bytes: 1073741824
  window:
    business_changes: 10000
    l0_index_modifications: 10000
    heatmap_bins: 1000

schema_version: 1
purpose: native_capture_poc
benchmark: sysbench
source:
  path: benchmark/sysbench
  commit: 3ceba0b1e115f8c50d1d045a4574d8ed643bd497
native:
  # 8 tables x 10,882,500 rows = 87,060,000 rows: the HyBench SF10 baseline row count.
  tables: 8
  table-size: 10882500
  secondary: false
  create-secondary: true
  auto-inc: true
  # Runtime switch the pinned scripts guard begin()/commit() with.
  skip-trx: false
  rand-seed: 20261019
  rand-type: uniform
  # Concurrent client threads, one backend each; prepare fills different tables in parallel.
  threads: 8
  prepare_threads: 8
  timeout_minutes: 720
  build_directory: build/benchmarks/sysbench
  binary: src/sysbench
  # Upstream Lua scripts run in this order on the same tables; each is a separate client process.
  # Calibration counts (10x the 8m run); plan-write-ratio derives the counts for a target ratio.
  workloads:
    oltp_read_write: {events: 80000}
    oltp_update_index: {events: 100000}
    oltp_update_non_index: {events: 100000}
    oltp_delete: {events: 50000}
    oltp_insert: {events: 50000}
    oltp_point_select: {events: 200000}
postgres:
  schema: public
  version: '14.24'
  port: 55433
  database: sibench_sysbench_87m_capture
  # The still database this capture clones; built once from the native load (see StillBase).
  clone_from: sibench_sysbench_87m_base
  user: postgres
  isolation: read_committed
  max_parallel_workers_per_gather: 0
capture:
  mode: instrumented_native_execution
  application_prefix: 'sibench:'
  raw_directory: results/poc/sysbench-87m/raw
  allow_event_loss: false
  statement_results: server_rows_and_consumed_rows
data_layout:
  target_file_size_bytes: 268435456
  row_group_max_rows: 1048576
  row_group_buffer_bytes: 67108864
  page_size_bytes: 1048576
  compression: zstd
  compression_level: 3
artifacts:
  directory: results/poc/sysbench-87m

schema_version: 1
purpose: native_capture_poc
benchmark: hybench
source:
  path: benchmark/HyBench-2024
  commit: eaad91b52956fddd3d48ce49f792928056b7b360
native:
  sf: 10x
  # HyBench resolves its native Data_10x input relative to this directory; the base stage
  # generates it once there and loads it into postgres.clone_from.
  work_dir: results/poc/hybench-sf10/native
  # runHTAP as designed: concurrent TP clients, then concurrent AT and IQ clients (AP runs its
  # rounds on one client, as upstream runAPower does).
  clients: 32
  ap_clients: 1
  xp_transaction_clients: 32
  xp_query_clients: 32
  duration_minutes: 1
  # TP and XP scale together. At this concurrency, the latest calibrated full capture
  # recorded cumulative row changes near 5% of the baseline count; timed runs vary.
  phase_duration_minutes:
    tp: 5
    xp: 5
postgres:
  schema: public
  version: '14.24'
  port: 55433
  database: sibench_htap_sf10_w5
  # The still SF10 load the capture database is cloned from; never measured directly.
  clone_from: sibench_sf10_base
  user: postgres
  isolation: read_committed
  max_parallel_workers_per_gather: 0
capture:
  mode: instrumented_native_execution
  application_prefix: 'sibench:'
  raw_directory: results/poc/hybench-htap-sf10-w5/raw
  allow_event_loss: false
  statement_results: server_rows_and_consumed_rows
data_layout:
  target_file_size_bytes: 536870912
  file_size_max_overshoot_percent: 5
  row_group_max_rows: 1048576
  row_group_buffer_bytes: 67108864
  page_size_bytes: 1048576
  compression: zstd
  compression_level: 3
artifacts:
  directory: results/poc/hybench-htap-sf10-w5

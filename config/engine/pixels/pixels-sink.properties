# Overrides of the pixels-sink defaults (third_party/pixels-sink). No freshness queries,
# rate limits or metric reports run during generation.
sink.monitor.enable=false
sink.monitor.report.enable=false
sink.monitor.freshness.level=none
sink.retina.log.queue=false
sink.datasource.rate.limit=-1
debezium.tombstones.on.delete=false
# Batch native requests and commits while preserving source transaction identities.
sink.retina.client=8
sink.retina.trans.limit=4096
sink.datasource.decode.threads=4
sink.flush.batch.size=1000
sink.flush.interval.ms=100
sink.commit.method=async
sink.commit.batch.size=500
sink.commit.batch.worker=8
sink.commit.batch.delay=100

# Pixels CDC generation engine. HyBench runs on an uninstrumented source PostgreSQL; pixels-sink
# applies its committed changes to Pixels Retina, whose primary-index calls form the Trace.
# generate-pixels selects this engine independently of the native benchmark engine selection.
# prepare-cdc verifies only this build's source PostgreSQL and sink artifacts, retaining baseline/row-CDC
# input without reading target storage/properties, starting Pixels or contacting pixels_host. See docs/cdc-input.md.
# Endpoints, run directories and semantic switches are assigned by the generator; the property
# files below hold only overrides of the upstream defaults pinned by third_party/.
schema_version: 1
purpose: engine
engine: pixels
build_directory: build/services/pixels
# "local" runs Pixels next to the generator; HOST:PORT names a `sibench pixels-host` agent.
pixels_host: local
# Required for reusable columnar baselines. Configure the storage profile before enabling.
# data_storage:
#   config: ../../index/storage.yaml
#   profile: cos
#   prefix: sibench/pixels
memory:
  coordinator_heap: 2g
  retina_heap: 16g
  sink_heap: 4g
load:
  rows_per_file: 1048576
  threads: 8
source:
  settings:
    shared_buffers: 256MB
    work_mem: 32MB
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    fsync: off
    synchronous_commit: off
    full_page_writes: off
    autovacuum: off
properties: pixels.properties
sink_properties: pixels-sink.properties

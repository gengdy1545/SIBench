# Pixels engine for the file-based CDC workflow, selected independently of the native benchmark engine.
# prepare-cdc records HyBench or Sysbench changes from an uninstrumented source PostgreSQL with pixels-sink and
# verifies only this build's source PostgreSQL and sink artifacts, without reading target storage/properties,
# starting Pixels or contacting pixels_host. prepare-pixels-baseline and pixels-experiment use the whole
# engine; an experiment's sink applies CDC files to Retina, whose primary-index calls can form a Trace.
# See docs/pixels-experiment.md. Hosts, run directories and semantic switches are assigned by SIBench.
# The property files hold upstream overrides, including optional fixed service ports for a dedicated external Trino.
schema_version: 1
purpose: engine
engine: pixels
build_directory: build/services/pixels
# "local" runs Pixels next to the controller; HOST:PORT names a `sibench pixels-host` agent.
pixels_host: local
# Required for reusable columnar baselines; connection comes from the runtime CONFIG.
# data_storage: cos://YOUR-BUCKET/sibench/baselines/pixels
memory:
  coordinator_heap: 2g
  retina_heap: 16g
  sink_heap: 4g
load:
  rows_per_file: 1048576
  threads: 8
source:
  settings:
    shared_buffers: 256MB
    work_mem: 32MB
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    fsync: off
    synchronous_commit: off
    full_page_writes: off
    autovacuum: off
properties: pixels.properties
sink_properties: pixels-sink.properties

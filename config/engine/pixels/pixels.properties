# Overrides of third_party/pixels pixels-common/src/main/resources/pixels.properties.
# One column family keeps the RocksDB write buffers below a single bounded budget.
index.rocksdb.multicf=false
index.rocksdb.write.buffer.size=2147483648
index.rocksdb.max.write.buffer.number=3
index.rocksdb.block.cache.capacity=1073741824
index.rocksdb.max.background.flushes=4
index.rocksdb.max.background.compactions=12
index.rocksdb.max.subcompactions=15
index.rocksdb.stats.enabled=false
index.cache.enabled=false
# Virtual nodes only spread buckets over several Retina nodes; generation runs one. Each
# (table, virtual node) keeps its own Retina write buffer and file writer, about 50 MB per pair.
node.virtual.num=1
# Background visibility GC also schedules recovery checkpoints; generation needs neither.
retina.gc.interval=0
retina.metrics.log.interval=-1
cache.enabled=false
metrics.server.enabled=false
scaling.enabled=false
vm.auto.scaling.enabled=false
sink.server.enabled=false

# Native PostgreSQL generation engine: source build and server settings.
# Listen address, port, socket directory and compute_query_id are assigned by the generator.
schema_version: 1
purpose: engine
engine: postgres
build_directory: build/services/postgres
settings:
  shared_buffers: 256MB
  work_mem: 32MB
  max_parallel_workers_per_gather: 0
  max_parallel_maintenance_workers: 0
  wal_level: minimal
  max_wal_senders: 0
  fsync: off
  synchronous_commit: off
  full_page_writes: off
  autovacuum: off

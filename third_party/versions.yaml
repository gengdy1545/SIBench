# Source versions are pinned by submodule gitlinks, not repeated here.
# Build/license metadata and service binary versions:
rocksdb_cloud:
  source: index/rocksdb-cloud
  base: RocksDB 9.1.1
  license: Apache-2.0 OR GPL-2.0 (RocksDB dual license)
  build: static_lib with USE_AWS=1 PORTABLE=1 DEBUG_LEVEL=0 USE_RTTI=1, gcc 8.5, glibc 2.28
aws_sdk_cpp:
  source: third_party/aws-sdk-cpp
  selection: matches rocksdb-cloud's Dockerfile; predates default request checksums
  license: Apache-2.0
  components: [core, s3, transfer, kinesis]
seaweedfs:            # local S3-compatible test service only, not an index backend
  release: "4.51"
  binary_sha256: eb9adf3a75b53c32f5ad9ba856e1fb652dae03dc6f6222673c3f88c0cbd25d0e
  license: Apache-2.0

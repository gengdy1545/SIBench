syntax = "proto3";

package sibench.index;

import "index_service.proto";

option java_multiple_files = true;
option java_package = "org.sibench.adapters.proto";

message ReadRequest {
  oneof operation {
    GetRequest get = 1;
    ScanRequest scan = 2;
  }
}

// One source query; the replay client combines the individual RPC results.
message ReadGroup {
  enum CombineMode {
    COMBINE_MODE_UNSPECIFIED = 0;
    INTERSECTION = 1;
    UNION = 2;
  }
  CombineMode combine_mode = 1;
  repeated ReadRequest requests = 2;
}

message TraceMetadata {
  uint64 source_event = 1;
  uint64 work_unit_id = 2;
  uint64 mutation_ordinal = 3;
  uint32 write_origin = 4;
  // Expected result count for a query or query group.
  uint64 expected_count = 5;
  uint32 baseline_position = 6;
  uint32 baseline_size = 7;
  // Alternative value for Locator replay; Put carries RowID.
  bytes locator = 8;
}

// One data request or read group with its source metadata.
message TraceOperation {
  oneof request {
    GetRequest get = 1;
    PutRequest put = 2;
    DeleteRequest delete = 3;
    ScanRequest scan = 4;
    ReadGroup read_group = 5;
  }
  // Shared by all requests in a read group.
  TraceMetadata metadata = 6;
}

message TraceRecord {
  oneof event {
    // Both boundaries carry the same positive source transaction version.
    uint64 transaction_begin = 1;
    TraceOperation operation = 2;
    uint64 transaction_commit = 3;
  }
}

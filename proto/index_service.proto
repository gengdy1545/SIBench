syntax = "proto3";

package sibench.index;

option java_multiple_files = true;
option java_package = "org.sibench.adapters.proto";

// Versioned KV operations over opaque byte keys and values.
// Timestamps are caller-assigned, nonnegative int64 values.
// Write success guarantees same-instance visibility.
// Persistence and storage maintenance are service responsibilities.
service IndexService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Scan(ScanRequest) returns (stream ScanResponse);
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse);
}

message GetRequest {
  bytes key = 1;
  uint64 read_ts = 2;
}

message GetResponse {
  // Absent means no visible entry; a present empty value is valid.
  optional bytes value = 1;
}

message PutRequest {
  bytes key = 1;
  uint64 ts = 2;
  bytes value = 3;
}

message PutResponse {
}

message DeleteRequest {
  bytes key = 1;
  uint64 ts = 2;
}

message DeleteResponse {
}

// Unsigned byte range [start_key, end_key). Absent bounds are unbounded.
message ScanRequest {
  optional bytes start_key = 1;
  optional bytes end_key = 2;
  uint64 read_ts = 3;
  // Zero means no limit on visible entries.
  uint64 limit = 4;
  bool reverse = 5;
}

message ScanResponse {
  // Values follow the requested key order and preserve duplicates.
  repeated bytes values = 1;
}

message Mutation {
  oneof operation {
    PutRequest put = 1;
    DeleteRequest delete = 2;
  }
}

// All mutations are validated before application.
// Execution may be partial; atomicity and rollback are not guaranteed.
message WriteBatchRequest {
  repeated Mutation mutations = 1;
}

message WriteBatchResponse {
}

# Parsing fixture; database and output locations are test placeholders.
schema_version: 1
purpose: native_capture_poc
benchmark: sysbench
source:
  path: benchmark/sysbench
  commit: 3ceba0b1e115f8c50d1d045a4574d8ed643bd497
native:
  tables: 2
  table-size: 1000
  secondary: false
  create-secondary: true
  auto-inc: true
  skip-trx: false
  rand-seed: 7
  rand-type: uniform
  threads: 1
  workloads:
    oltp_read_write: {events: 1}
postgres:
  schema: public
  version: '14.24'
  port: 5432
  database: fixture_sysbench_capture
  clone_from: fixture_sysbench_base
  user: postgres
  isolation: read_committed
  max_parallel_workers_per_gather: 0
capture:
  mode: instrumented_native_execution
  application_prefix: 'sibench:'
  raw_directory: results/poc/tests/sysbench_2k/raw
  allow_event_loss: false
  statement_results: server_rows_and_consumed_rows
data_layout:
  target_file_size_bytes: 536870912
  file_size_max_overshoot_percent: 5
  row_group_max_rows: 1048576
  row_group_buffer_bytes: 67108864
  page_size_bytes: 1048576
  compression: zstd
  compression_level: 3
artifacts:
  directory: results/poc/tests/sysbench_2k

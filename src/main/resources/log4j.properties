# Hadoop and parquet-java log through log4j 1.x (reload4j). Without a configuration its root level
# is DEBUG, and parquet-java then formats every record it reads or writes for a logger that
# discards it: Parquet writes ran about 7x and reads 1.5x slower. Warnings still reach stderr.
log4j.rootLogger=WARN, stderr
log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%d{ISO8601} %p %c: %m%n
